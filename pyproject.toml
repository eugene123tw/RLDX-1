#This is the single project pyproject.toml

[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "rldx"
dynamic = ["version"]
description = "RLDX-1: Vision-Language-Action model for dexterous manipulation."
readme = "README.md"
requires-python = "==3.10.*"
license = {text = "Apache-2.0"}
keywords = [
    "vision-language-action",
    "robotics",
    "manipulation",
    "imitation-learning",
    "flow-matching",
    "diffusion-policy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Baseline dependencies, pinned exactly so every install resolves the same.
dependencies = [
    "albumentations==1.4.18",
    "av==15.0.0",
    "diffusers==0.35.1",
    "dm-tree==0.1.8",
    "lmdb==1.7.5",
    "msgpack==1.1.0",
    "msgpack-numpy==0.4.8",
    "pandas==2.2.3",
    "peft==0.17.1",
    "termcolor==3.2.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.57.0",
    "tyro==1.0.16",
    # flash-attn is a required runtime dep on every CUDA install. The
    # ``sys_platform == 'linux'`` marker keeps it out of macOS / Windows
    # resolution, where it cannot build and no CUDA kernel would run anyway,
    # so those platforms need no extra ``uv sync`` flag. Linux CPU-only boxes
    # (lint, doc, CI) are still selected by the marker and must use
    # ``uv sync --no-install-package flash-attn`` (the same flag CI uses).
    # RTX 5090 / Blackwell (sm_120) builds use the pixi environment instead
    # — see ``pixi.toml`` and ``docs/installation.md``.
    "flash-attn==2.7.4.post1 ; sys_platform == 'linux'",
    "click==8.2.1",
    "datasets==3.6.0",
    "einops==0.8.1",
    "matplotlib==3.10.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "optree==0.20.0",
    "scipy==1.15.3",
    "torchcodec==0.4.0",
    "wandb==0.30.0",
    "pyzmq==27.0.1",
    "deepspeed==0.19.6",
    "moviepy==1.0.3",
    "opencv-contrib-python-headless==4.11.0.86",
    # Previously implicit via transformers' transitive install; pinned
    # explicitly so a transformers upgrade cannot silently drop them.
    "accelerate>=0.34",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "requests>=2.32",
    "PyYAML>=6.0",
    "packaging>=24.0",
    # torch.compile's CPU backend imports it at run time; triton brings it only on Linux x86_64.
    "setuptools>=67",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
    "ipython",
]
# Evaluation-specific clients. Not needed for ``import rldx`` or training.
# Install with ``uv sync --extra eval``. ``lerobot`` is intentionally NOT
# listed — 0.3.3 is the last release that writes LeRobot v2.1, and its
# ``gymnasium<1.0`` pin clashes with the one below. Install manually after
# ``uv sync`` if you need the LeRobot dataset-conversion path
# (``run_scripts/data/convert_h5_to_v2.py``):
# ``uv pip install --no-deps lerobot==0.3.3 jsonlines h5py``.
eval = [
    # Only the sim harness imports it, and that runs under the simulator
    # venvs; CI needs it because the packaging tests import those modules.
    "gymnasium==1.2.2",
    "imageio>=2.34",
    "transforms3d>=0.4",
]
tensorrt = [
    "onnx>=1.20.0",
    "tensorrt>=10.14.1.48.post1",
]
nvfp4 = [
    "flashinfer-python>=0.6.10",
]

[project.urls]
Homepage = "https://rlwrld.ai/rldx-1"
Repository = "https://github.com/RLWRLD/RLDX-1"
Issues = "https://github.com/RLWRLD/RLDX-1/issues"

[tool.setuptools.dynamic]
version = {attr = "rldx.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["rldx*"]
# ``namespaces`` defaults to true, so without this the __init__-less
# directories under rldx/eval/sim/ are packaged along with the harness.
exclude = ["rldx.eval.sim*"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.7.0", "numpy==1.26.4"]

# ``tensorrt-cu13-libs`` (from the ``tensorrt`` extra) ships only an sdist
# whose build backend downloads a wheel matching the *host* platform tag. uv
# resolves universally, so it needs that metadata even where no such wheel
# exists — which made ``uv lock`` impossible to run from a Mac at all. The
# package is a payload of CUDA shared objects with no runtime dependencies
# (confirmed against the resolved entry in uv.lock), so declaring that lets
# uv skip the build. Linux resolution is unchanged.
[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"
requires-dist = []

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["rldx"]
exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".vscode",
    ".venv",
    "dist",
    "logs",
    "*.ipynb",
    "external_dependencies",
    "symlinks",
    "run_scripts",
    "ckpt",
    "output",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = false
split-on-trailing-comma = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
