# pixi environments for builds the uv path (root pyproject.toml) cannot serve.
#
# ``default`` — RTX 5090 / Blackwell (sm_120). CUDA 12.8 + torch 2.8.0+cu128 +
# flash-attn source-built for sm_120.
#
# ``quantize`` — quantized inference on CUDA 13 (torch, triton, flashinfer for
# the nvfp4 GEMM, flash-attn), on x86 and aarch64 (GB10 / Thor).
#
# flash-attn ships no wheel for either stack, so each env source-builds it
# against its own torch / cuda-toolkit (see the ``install-flash-attn`` tasks).
# flash-attn uses its own arch selector ``FLASH_ATTN_CUDA_ARCHS`` (not
# ``TORCH_CUDA_ARCH_LIST``) so only the archs we run are compiled.
#
# The uv path stays canonical for SM_80/SM_90.
# See ``docs/installation.md`` for which path to pick.

[workspace]
channels = ["nvidia", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.68"

[system-requirements]
cuda = "12"

[dependencies]
python = "3.10.*"
pip = "*"

[pypi-dependencies]
pytz = "*"
python-dateutil = "*"
tqdm = ">=4.66"
filelock = "*"

[environments]
default = { features = ["common", "base"], solve-group = "default" }
quantize = ["common", "quantize"]

# Mirrors ``[project.dependencies]`` in pyproject.toml, minus the torch family
# each env pins for its own CUDA line. Keep this list synced with pyproject.toml
# on every dependency change.
[feature.common.pypi-dependencies]
transformers = "==4.57.0"
peft = "==0.17.1"
diffusers = "==0.35.1"
einops = "==0.8.1"
numpy = "==1.26.4"
scipy = "==1.15.3"
omegaconf = "==2.3.0"
optree = "==0.20.0"
termcolor = "==3.2.0"
albumentations = "==1.4.18"
dm-tree = "==0.1.8"
pyzmq = "==27.0.1"
msgpack = "==1.1.0"
msgpack-numpy = "==0.4.8"
tyro = "==1.0.16"
pandas = "==2.2.3"
av = "==15.0.0"
click = "==8.2.1"
lmdb = "==1.7.5"
matplotlib = "==3.10.1"
datasets = "==3.6.0"
gymnasium = "==1.2.2"
wandb = "==0.30.0"
deepspeed = "==0.19.6"
moviepy = "==1.0.3"
opencv-contrib-python-headless = "==4.11.0.86"
# Previously implicit transitives, now pinned explicitly.
accelerate = ">=0.34"
safetensors = ">=0.4.5"
huggingface-hub = ">=0.26"
Pillow = ">=10.0"
requests = ">=2.32"
PyYAML = ">=6.0"
packaging = ">=24.0"
setuptools = ">=67"

[feature.base]
platforms = ["linux-64"]

[feature.base.dependencies]
# CUDA 12.8 toolkit is the build-time dependency for flash-attn's NVCC
# compile step. nvidia channel ships matching nvcc + headers.
cuda-toolkit = "12.8.*"

[feature.base.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cu128" }
torchcodec = { version = "==0.7.0", index = "https://download.pytorch.org/whl/cu128" }

# flash-attn ignores ``TORCH_CUDA_ARCH_LIST`` and uses its own
# ``FLASH_ATTN_CUDA_ARCHS`` (semicolon-separated, default
# ``"80;90;100;120"``). On a single-GPU sm_120 host the other three
# archs are pure waste — building only ``"120"`` cuts wall-clock
# time roughly 4×. ``FLASH_ATTENTION_FORCE_BUILD=TRUE`` skips the
# pre-built wheel lookup so the source build always runs.
# ``MAX_JOBS`` is intentionally unset — ninja then defaults to
# ``nproc``, which on a single-arch build (sm_120 only) cuts the
# per-job memory footprint by ~4× vs. the 4-arch default and easily
# fits in 188 GB RAM at full parallelism. ``CUDA_HOME`` points at
# the env's cu128 toolchain so the build doesn't pick up a system
# ``/usr/local/cuda-*`` that might mismatch torch's CUDA version.
[feature.base.tasks.install-flash-attn]
cmd = "pip install git+https://github.com/Dao-AILab/flash-attention.git@v2.8.3 --no-build-isolation"
env = { FLASH_ATTN_CUDA_ARCHS = "120", FLASH_ATTENTION_FORCE_BUILD = "TRUE", CUDA_HOME = "$CONDA_PREFIX" }

# ``postinstall`` is the single entry point after ``pixi install``.
# It chains ``install-flash-attn`` first (source build targeting sm_120) and
# then editable-installs the rldx package against the pixi-managed torch.
# No separate manual step is needed to get flash-attn.
[feature.base.tasks.postinstall]
depends-on = ["install-flash-attn"]
cmd = "pip install -e . --no-deps"

[feature.base.activation]
env = { TORCH_CUDA_ARCH_LIST = "sm_120" }


[feature.quantize]
platforms = ["linux-64", "linux-aarch64"]

[feature.quantize.system-requirements]
cuda = "13"

[feature.quantize.dependencies]
# torch 2.14 wheels need setuptools<82; conda otherwise solves 82.x.
setuptools = "<82"
ninja = "*"

# torch's cu130 build pins cuBLAS 13.1; 13.5 picks faster bf16 GEMM kernels on GB10.
[feature.quantize.pypi-options.dependency-overrides]
nvidia-cublas = "==13.5.1.27"

[feature.quantize.pypi-dependencies]
torch = { version = "==2.14.1", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.29.1", index = "https://download.pytorch.org/whl/cu130" }
torchcodec = { version = "==0.17.0", index = "https://download.pytorch.org/whl/cu130" }
triton = "==3.8.0"
# ``b12x`` carries the sm_120/121 NVFP4 GEMM and pins nvidia-cutlass-dsl.
flashinfer-python = { version = "==0.7.2", extras = ["b12x", "cu13"] }

[feature.quantize.tasks.install-flash-attn]
cmd = "bash run_scripts/install/flash_attn.sh"
env = { GIT_CONFIG_GLOBAL = "/dev/null" }

[feature.quantize.tasks.postinstall]
depends-on = ["install-flash-attn"]
cmd = "pip install -e . --no-deps"

# The host's CUDA 13.0 toolkit, as in the nvidia/cuda:13.0 images:
# flash-attn's build and flashinfer's JIT expect the $CUDA_HOME/{bin,include,lib64}
# layout, which conda's cuda-toolkit does not provide (and has no aarch64 build).
[feature.quantize.activation]
env = { CUDA_HOME = "/usr/local/cuda-13.0", NO_ALBUMENTATIONS_UPDATE = "1" }
